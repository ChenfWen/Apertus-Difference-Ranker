[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apertus-v15-final-rsd"
version = "0.1.0"
description = "Frozen Apertus v1.5 representations with lightweight SwissGov-RSD rankers"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
  "accelerate>=1.0",
  "datasets==5.0.1",
  "huggingface-hub==1.5.0",
  "joblib>=1.4",
  "matplotlib>=3.8",
  "numpy>=2.0,<3",
  "scikit-learn>=1.5",
  "scipy>=1.12",
  "safetensors==0.8.0",
  "sentencepiece==0.2.2",
  "tqdm>=4.66",
  "transformers[vision,audio] @ git+https://github.com/swiss-ai/transformers.git@3797303dda74844e3d1f8977ff5518bb91f818b4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
apertus-final-rsd = "apertus_final_rsd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

